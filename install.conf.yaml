- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config', '~/.local/bin']

- link:
    ~/:
      glob: true
      path: home/*
      prefix: '.'
      exclude: [home/codex]
    ~/.codex/AGENTS.md:
      path: home/codex/AGENTS.md
    ~/.config/:
      glob: true
      path: config/*
    ~/.local/bin/:
      glob: true
      path: bin/*
