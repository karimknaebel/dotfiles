[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[git_branch]
symbol = " "

[conda]
symbol = "🐉 "
ignore_base = false

[python]
# python_binary = [["uv", "run", "--no-python-downloads", "--no-sync", "python"]]
disabled = true

[custom.uv_python]
command = 'uv python find --show-version'
shell = "sh" # much faster
format = 'via [${symbol}(${output} )]($style)'
symbol = "uv "
detect_extensions = ['py', 'ipynb']
detect_files = [
  '.python-version',
  'Pipfile',
  '__init__.py',
  'pyproject.toml',
  'requirements.txt',
  'setup.py',
  'tox.ini',
  'uv.lock',
  'pylock.toml',
]
style = "bold purple"

[gcloud]
detect_env_vars = ['CLOUDSDK_CONFIG']

[env_var.CUDA_HOME]

[env_var.STARSHIP_PRIVATE_MODE]
format = '[🎭 $env_value]($style) '
style = "bold yellow"
